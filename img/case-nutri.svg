<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-label="Mockup de la app de pedidos de Nutrí Delivery">
  <title>App de pedidos — Nutrí Delivery</title>
  <defs>
    <clipPath id="nd-frame"><rect width="800" height="560" rx="16"/></clipPath>
    <clipPath id="nd-phone-a"><rect x="122" y="86" width="248" height="440" rx="30"/></clipPath>
    <clipPath id="nd-phone-b"><rect x="430" y="126" width="248" height="400" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#nd-frame)">
    <rect width="800" height="560" fill="#EFF6FF"/>

    <!-- Motivo de nodos de fondo -->
    <g opacity="0.55">
      <line x1="60" y1="90" x2="150" y2="40" stroke="#C7D7F5" stroke-width="1"/>
      <line x1="150" y1="40" x2="300" y2="70" stroke="#C7D7F5" stroke-width="1"/>
      <line x1="60" y1="90" x2="70" y2="230" stroke="#C7D7F5" stroke-width="1"/>
      <line x1="70" y1="230" x2="46" y2="380" stroke="#C7D7F5" stroke-width="1"/>
      <line x1="700" y1="80" x2="756" y2="180" stroke="#C7D7F5" stroke-width="1"/>
      <line x1="756" y1="180" x2="712" y2="300" stroke="#C7D7F5" stroke-width="1"/>
      <line x1="712" y1="300" x2="760" y2="440" stroke="#C7D7F5" stroke-width="1"/>
      <circle cx="60" cy="90" r="4.5" fill="#1E3A8A"/>
      <circle cx="150" cy="40" r="3.5" fill="#06B6D4"/>
      <circle cx="300" cy="70" r="3.5" fill="#06B6D4"/>
      <circle cx="70" cy="230" r="3.5" fill="#06B6D4"/>
      <circle cx="46" cy="380" r="3.5" fill="#06B6D4"/>
      <circle cx="700" cy="80" r="3.5" fill="#06B6D4"/>
      <circle cx="756" cy="180" r="4.5" fill="#1E3A8A"/>
      <circle cx="712" cy="300" r="3.5" fill="#06B6D4"/>
      <circle cx="760" cy="440" r="3.5" fill="#06B6D4"/>
    </g>

    <!-- ============ Teléfono B: seguimiento ============ -->
    <rect x="424" y="120" width="260" height="412" rx="36" fill="#111827" opacity="0.10"/>
    <rect x="430" y="126" width="248" height="400" rx="30" fill="#111827"/>
    <rect x="436" y="132" width="236" height="388" rx="26" fill="#FFFFFF"/>
    <g clip-path="url(#nd-phone-b)">
      <rect x="436" y="132" width="236" height="46" fill="#FFFFFF"/>
      <rect x="516" y="140" width="76" height="8" rx="4" fill="#E5E7EB"/>
      <path d="M462 166l-8-8 8-8" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="478" y="158" width="94" height="8" rx="4" fill="#111827"/>

      <!-- Mapa -->
      <rect x="436" y="178" width="236" height="212" fill="#F3F4F6"/>
      <g stroke="#E5E7EB" stroke-width="1">
        <line x1="436" y1="218" x2="672" y2="218"/>
        <line x1="436" y1="266" x2="672" y2="266"/>
        <line x1="436" y1="314" x2="672" y2="314"/>
        <line x1="436" y1="362" x2="672" y2="362"/>
        <line x1="492" y1="178" x2="492" y2="390"/>
        <line x1="556" y1="178" x2="556" y2="390"/>
        <line x1="620" y1="178" x2="620" y2="390"/>
      </g>
      <!-- Ruta con el motivo de nodos -->
      <polyline points="478,352 528,318 578,336 616,270 646,214"
                fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="478" cy="352" r="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/>
      <circle cx="528" cy="318" r="4" fill="#06B6D4"/>
      <circle cx="578" cy="336" r="4" fill="#06B6D4"/>
      <circle cx="616" cy="270" r="4" fill="#06B6D4"/>
      <circle cx="646" cy="214" r="9" fill="#1E3A8A"/>
      <circle cx="646" cy="214" r="3.5" fill="#FFFFFF"/>

      <!-- Tarjeta de ETA -->
      <rect x="452" y="404" width="204" height="98" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="470" y="422" width="60" height="18" rx="9" fill="#D1FAE5"/>
      <rect x="480" y="428" width="40" height="6" rx="3" fill="#10B981"/>
      <rect x="470" y="452" width="118" height="9" rx="4.5" fill="#111827"/>
      <rect x="470" y="470" width="86" height="6" rx="3" fill="#9CA3AF"/>
      <circle cx="622" cy="452" r="18" fill="#EFF6FF"/>
      <path d="M622 442v10l7 4" fill="none" stroke="#1E3A8A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ============ Teléfono A: pedido ============ -->
    <rect x="116" y="80" width="260" height="452" rx="36" fill="#111827" opacity="0.12"/>
    <rect x="122" y="86" width="248" height="440" rx="30" fill="#111827"/>
    <rect x="128" y="92" width="236" height="428" rx="26" fill="#FFFFFF"/>
    <g clip-path="url(#nd-phone-a)">
      <!-- Notch -->
      <rect x="212" y="92" width="68" height="16" rx="8" fill="#111827"/>

      <!-- Encabezado -->
      <rect x="128" y="116" width="236" height="72" fill="#1E3A8A"/>
      <circle cx="154" cy="146" r="11" fill="#FFFFFF" opacity="0.18"/>
      <line x1="154" y1="146" x2="154" y2="139" stroke="#06B6D4" stroke-width="1.8"/>
      <line x1="154" y1="146" x2="160" y2="150" stroke="#06B6D4" stroke-width="1.8"/>
      <line x1="154" y1="146" x2="148" y2="150" stroke="#06B6D4" stroke-width="1.8"/>
      <rect x="174" y="136" width="92" height="9" rx="4.5" fill="#FFFFFF"/>
      <rect x="174" y="152" width="62" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
      <rect x="152" y="168" width="188" height="0" rx="0" fill="none"/>

      <!-- Buscador -->
      <rect x="148" y="204" width="196" height="30" rx="15" fill="#F9FAFB" stroke="#E5E7EB"/>
      <circle cx="169" cy="219" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
      <line x1="173" y1="223" x2="177" y2="227" stroke="#9CA3AF" stroke-width="1.6"/>
      <rect x="186" y="216" width="92" height="6" rx="3" fill="#E5E7EB"/>

      <!-- Ítems del pedido -->
      <rect x="148" y="250" width="196" height="62" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="162" y="264" width="34" height="34" rx="8" fill="#D1FAE5"/>
      <circle cx="179" cy="281" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
      <rect x="208" y="266" width="88" height="8" rx="4" fill="#111827"/>
      <rect x="208" y="282" width="54" height="6" rx="3" fill="#9CA3AF"/>
      <rect x="304" y="272" width="26" height="8" rx="4" fill="#1E3A8A"/>

      <rect x="148" y="322" width="196" height="62" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="162" y="336" width="34" height="34" rx="8" fill="#FEF3C7"/>
      <rect x="171" y="345" width="16" height="16" rx="4" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <rect x="208" y="338" width="72" height="8" rx="4" fill="#111827"/>
      <rect x="208" y="354" width="60" height="6" rx="3" fill="#9CA3AF"/>
      <rect x="304" y="344" width="26" height="8" rx="4" fill="#1E3A8A"/>

      <rect x="148" y="394" width="196" height="62" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="162" y="408" width="34" height="34" rx="8" fill="#ECFEFF"/>
      <path d="M171 425l6 6 10-12" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
      <rect x="208" y="410" width="94" height="8" rx="4" fill="#111827"/>
      <rect x="208" y="426" width="46" height="6" rx="3" fill="#9CA3AF"/>
      <rect x="304" y="416" width="26" height="8" rx="4" fill="#1E3A8A"/>

      <!-- Barra de total -->
      <rect x="128" y="468" width="236" height="52" fill="#FFFFFF"/>
      <line x1="128" y1="468" x2="364" y2="468" stroke="#E5E7EB"/>
      <rect x="148" y="482" width="44" height="6" rx="3" fill="#9CA3AF"/>
      <rect x="148" y="496" width="62" height="10" rx="5" fill="#111827"/>
      <rect x="234" y="480" width="110" height="30" rx="8" fill="#06B6D4"/>
      <rect x="256" y="492" width="66" height="7" rx="3.5" fill="#FFFFFF"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="799" height="559" rx="16" fill="none" stroke="#E5E7EB"/>
</svg>
