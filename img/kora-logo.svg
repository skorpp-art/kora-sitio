<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="KORA — Tu núcleo digital: web, chatbots y apps">
  <title>KORA — logotipo horizontal</title>
  <!--
    Versión completa con íconos de servicio en cada nodo y el texto al lado.

    OJO CON LA TIPOGRAFÍA: el texto va como <text> con Sora. Si este archivo
    se usa incrustado en el sitio (que ya carga Sora), se ve perfecto. Si se
    abre suelto o se manda por mail en un equipo sin Sora instalada, cae a la
    tipografía de sistema y cambia el aspecto.

    Para un logotipo definitivo — el que va a papelería, facturas o un cartel —
    hay que abrir esto en un editor vectorial y convertir el texto a curvas.
    Es un minuto de trabajo y lo deja a prueba de todo.
  -->

  <!-- ===================== Isotipo ===================== -->
  <g transform="translate(10 12) scale(1.05)">
    <g fill="none" stroke="#1E3A8A" stroke-width="9">
      <circle cx="64" cy="41" r="23"/>
      <circle cx="83.92" cy="75.5" r="23"/>
      <circle cx="44.08" cy="75.5" r="23"/>
    </g>
    <circle cx="64" cy="64" r="15" fill="#1E3A8A"/>

    <!-- Nodo superior: web -->
    <circle cx="64" cy="18" r="12.5" fill="#06B6D4"/>
    <g stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <rect x="57.5" y="12.5" width="13" height="11" rx="1.6"/>
      <line x1="57.5" y1="16" x2="70.5" y2="16"/>
    </g>
    <circle cx="59.8" cy="14.2" r="0.7" fill="#FFFFFF"/>
    <circle cx="62" cy="14.2" r="0.7" fill="#FFFFFF"/>

    <!-- Nodo derecho: chatbots -->
    <circle cx="103.84" cy="87" r="12.5" fill="#06B6D4"/>
    <path d="M97.6 81.8h12.5a1.7 1.7 0 0 1 1.7 1.7v6.2a1.7 1.7 0 0 1-1.7 1.7h-7.4l-4.3 3.1v-3.1h-0.8a1.7 1.7 0 0 1-1.7-1.7v-6.2a1.7 1.7 0 0 1 1.7-1.7z"
          fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="101.3" cy="86.6" r="0.9" fill="#FFFFFF"/>
    <circle cx="105.1" cy="86.6" r="0.9" fill="#FFFFFF"/>

    <!-- Nodo izquierdo: apps -->
    <circle cx="24.16" cy="87" r="12.5" fill="#06B6D4"/>
    <rect x="19.2" y="80.5" width="10" height="13" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="22.2" y1="83.2" x2="26.2" y2="83.2" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="24.16" cy="90.6" r="1" fill="#FFFFFF"/>
  </g>

  <!-- ===================== Logotipo ===================== -->
  <text x="176" y="88"
        font-family="Sora, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="62" font-weight="800" letter-spacing="-1.5" fill="#111827">KORA</text>

  <text x="179" y="118"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="15.5" font-weight="500" letter-spacing="0.4" fill="#6B7280">Tu núcleo digital: web, chatbots y apps</text>
</svg>
