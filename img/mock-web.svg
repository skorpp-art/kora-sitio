      <circle cx="516" cy="222" r="7" fill="#FFFFFF"/>
      <circle cx="580" cy="252" r="5" fill="#06B6D4"/>
      <circle cx="540" cy="176" r="4.5" fill="#06B6D4"/>
      <circle cx="608" cy="196" r="4.5" fill="#06B6D4"/>
    </g>

    <!-- Tres tarjetas de servicio -->
    <g>
      <rect x="28" y="410" width="192" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="50" y="432" width="34" height="34" rx="9" fill="#ECFEFF"/>
      <rect x="59" y="443" width="16" height="12" rx="2" fill="none" stroke="#06B6D4" stroke-width="2"/>
      <rect x="50" y="486" width="96" height="9" rx="4.5" fill="#111827"/>
      <rect x="50" y="508" width="146" height="6" rx="3" fill="#E5E7EB"/>
      <rect x="50" y="524" width="118" height="6" rx="3" fill="#E5E7EB"/>

      <rect x="234" y="410" width="192" height="150" rx="12" fill="#FFFFFF" stroke="#06B6D4"/>
      <rect x="256" y="432" width="34" height="34" rx="9" fill="#ECFEFF"/>
      <circle cx="269" cy="449" r="2.6" fill="#06B6D4"/>
      <circle cx="279" cy="449" r="2.6" fill="#06B6D4"/>
      <rect x="256" y="486" width="112" height="9" rx="4.5" fill="#111827"/>
      <rect x="256" y="508" width="150" height="6" rx="3" fill="#E5E7EB"/>
      <rect x="256" y="524" width="104" height="6" rx="3" fill="#E5E7EB"/>

      <rect x="440" y="410" width="192" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="462" y="432" width="34" height="34" rx="9" fill="#ECFEFF"/>
      <rect x="472" y="440" width="14" height="18" rx="3" fill="none" stroke="#06B6D4" stroke-width="2"/>
      <rect x="462" y="486" width="86" height="9" rx="4.5" fill="#111827"/>
      <rect x="462" y="508" width="140" height="6" rx="3" fill="#E5E7EB"/>
      <rect x="462" y="524" width="112" height="6" rx="3" fill="#E5E7EB"/>
    </g>

    <!-- Franja de métricas -->
    <rect x="28" y="590" width="604" height="96" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <line x1="229" y1="590" x2="229" y2="686" stroke="#E5E7EB"/>
    <line x1="430" y1="590" x2="430" y2="686" stroke="#E5E7EB"/>
    <rect x="56" y="618" width="58" height="20" rx="5" fill="#1E3A8A"/>
    <rect x="56" y="648" width="104" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="257" y="618" width="72" height="20" rx="5" fill="#1E3A8A"/>
    <rect x="257" y="648" width="88" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="458" y="618" width="50" height="20" rx="5" fill="#1E3A8A"/>
    <rect x="458" y="648" width="112" height="6" rx="3" fill="#E5E7EB"/>

