    <rect x="0" y="716" width="660" height="84" fill="#111827"/>
    <circle cx="42" cy="752" r="11" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="42" cy="752" r="4" fill="#06B6D4"/>
    <rect x="64" y="748" width="40" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="420" y="750" width="52" height="5" rx="2.5" fill="#6B7280"/>
    <rect x="488" y="750" width="44" height="5" rx="2.5" fill="#6B7280"/>
    <rect x="548" y="750" width="60" height="5" rx="2.5" fill="#6B7280"/>
